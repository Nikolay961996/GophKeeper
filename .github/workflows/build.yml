name: Build Go Application

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            client_binary: gophkeeper-client
            server_binary: gophkeeper-server
          - os: windows-latest
            client_binary: gophkeeper-client.exe
            server_binary: gophkeeper-server.exe
          - os: macos-latest
            client_binary: gophkeeper-client
            server_binary: gophkeeper-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Client
        shell: bash
        run: |
          go build -v -o ${{ matrix.client_binary }} \
            -ldflags="-X main.version=${{ github.ref_name }} \
                     -X main.commit=${{ github.sha }} \
                     -X main.date=$(date -u +'%Y-%m-%d_%H:%M:%S')" \
            ./cmd/client

      - name: Build Server
        shell: bash
        run: |
          go build -v -o ${{ matrix.server_binary }} \
            -ldflags="-X main.version=${{ github.ref_name }} \
                     -X main.commit=${{ github.sha }} \
                     -X main.date=$(date -u +'%Y-%m-%d_%H:%M:%S')" \
            ./cmd/server

      - name: Create artifacts directory
        shell: bash
        run: |
          mkdir -p artifacts

      - name: Copy binaries to artifacts
        shell: bash
        run: |
          cp ${{ matrix.client_binary }} artifacts/
          cp ${{ matrix.server_binary }} artifacts/
          echo "Build: ${{ github.ref_name }}" > artifacts/version.txt
          echo "Commit: ${{ github.sha }}" >> artifacts/version.txt
          echo "Date: $(date -u)" >> artifacts/version.txt
          echo "OS: ${{ matrix.os }}" >> artifacts/version.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gophkeeper-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gophkeeper-*
          path: dist

      - name: List downloaded files
        run: |
          find dist -type f | sort
          echo "Files for release:"
          ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/gophkeeper-client*
            dist/**/gophkeeper-server*
          generate_release_notes: true