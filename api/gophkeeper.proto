syntax = "proto3";

package gophkeeper;

option go_package = "gophkeeper/api";

import "google/protobuf/timestamp.proto";

service GophKeeper {
  // Универсальный Opaque API метод
  rpc Execute(CommandRequest) returns (CommandResponse) {};

  // Потоковая передача больших файлов
  rpc UploadFile(stream FileChunk) returns (UploadResponse) {};
  rpc DownloadFile(DownloadRequest) returns (stream FileChunk) {};
}

// Универсальный запрос команды
message CommandRequest {
  string operation = 1;
  bytes payload = 2; // Сериализованные данные операции
}

// Универсальный ответ команды
message CommandResponse {
  bool success = 1;
  string error = 2;
  bytes payload = 3; // Сериализованные данные ответа
}

// Операции
message RegisterOperation {
  string login = 1;
  string password = 2;
}

message LoginOperation {
  string login = 1;
  string password = 2;
}

message SyncOperation {
  google.protobuf.Timestamp last_sync = 1;
  repeated SecretData data = 2;
}

message SyncResult {
  google.protobuf.Timestamp last_sync = 1;
  repeated SecretData data = 2;
  repeated SecretData conflicts = 3;
}

// Потоковая передача файлов
message FileChunk {
  string file_id = 1;
  string file_name = 2;
  bytes chunk_data = 3;
  int32 chunk_index = 4;
  int32 total_chunks = 5;
  string checksum = 6;
}

message UploadResponse {
  string file_id = 1;
  int64 file_size = 2;
  string checksum = 3;
  bool success = 4;
}

message DownloadRequest {
  string file_id = 1;
}

// Общие сообщения
message User {
  string id = 1;
  string login = 2;
  google.protobuf.Timestamp created_at = 3;
}

message SecretData {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string name = 4;
  bytes data = 5;
  string metadata = 6;
  int32 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}